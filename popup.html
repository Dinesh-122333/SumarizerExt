<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Summarizer</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f9f9f9;
      padding: 20px;
      width: 320px;
    }

    h1 {
      font-size: 22px;
      color: #2c3e50;
      margin-bottom: 20px;
      text-align: center;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 15px;
    }

    select,
    button {
      padding: 10px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #ccc;
      outline: none;
      transition: border-color 0.2s ease;
    }

    select:hover,
    button:hover {
      border-color: #888;
    }

    button {
      background-color: #4caf50;
      color: #fff;
      cursor: pointer;
    }

    #copy-btn {
      background-color: #2196f3;
    }

    #result {
      background-color: #f0f0f0;
      padding: 12px;
      font-size: 14px;
      white-space: pre-wrap;
      word-wrap: break-word;
      border-radius: 6px;
      border: 1px solid #ccc;
      min-height: 120px;
      color: #333;
    }
  </style>
</head>
<body>
  <h1>AI Summarizer</h1>

  <div class="controls">
    <select id="summary-type">
      <option value="brief">Brief</option>
      <option value="detailed">Detailed</option>
      <option value="bullets">Bullet Points</option>
    </select>

    <button id="summarize">Summarize This Page</button>
    <button id="copy-btn">Copy Summary</button>
  </div>

  <div id="result">
    Select a summary type and click “Summarize This Page” to generate a summary.
  </div>

<!--   <script src="config.js"></script> -->
  <script src="popup.js"></script>
</body>
</html>
